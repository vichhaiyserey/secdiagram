name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PIP_VERSION: "26.3"

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is required: the project must analyze and run cross-platform,
        # so the suite is enforced on both operating systems.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Run unit tests including Dart and Flutter regressions
        run: python -m coverage run --branch -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        shell: bash
        run: python -m coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate coverage XML
        if: matrix.python-version == '3.12'
        run: python -m coverage xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  sonar-coverage:
    name: SonarQube Cloud coverage (opt-in)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_CI_ANALYSIS_ENABLED: ${{ vars.SONAR_CI_ANALYSIS_ENABLED }}
    steps:
      - name: Explain missing Sonar configuration
        if: env.SONAR_TOKEN == '' || env.SONAR_CI_ANALYSIS_ENABLED != 'true'
        run: echo '::notice::Coverage artifacts are available. CI-based Sonar import requires SONAR_TOKEN and SONAR_CI_ANALYSIS_ENABLED=true after Automatic Analysis is disabled. Automatic Analysis is otherwise unchanged.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SONAR_TOKEN != '' && env.SONAR_CI_ANALYSIS_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Python coverage
        if: env.SONAR_TOKEN != '' && env.SONAR_CI_ANALYSIS_ENABLED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-ubuntu-latest
      - name: Analyze source and import coverage
        if: env.SONAR_TOKEN != '' && env.SONAR_CI_ANALYSIS_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          scannerVersion: 8.5.0.16571
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy
      - name: Studio JavaScript syntax check
        run: node --check secdiagram_core/studio_ui/app.js
      - name: Task tooling tests
        run: python -m unittest tests.test_taskctl -v
      - name: Task cache validation
        run: python scripts/taskctl.py validate --offline

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Bandit high-severity gate
        run: python -m bandit -r secdiagram_core -lll -f txt
      - name: Bandit full report
        if: always()
        continue-on-error: true
        run: python -m bandit -r secdiagram_core -f json -o bandit.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: ignore
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip_audit --strict --progress-spinner off -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-fs.sarif
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: tests/fixtures,.git,.venv
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy
        continue-on-error: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
